version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: taskmanagement-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
      POSTGRES_DB: taskmanagement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskmanagement"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskmanagement-network

  # Backend Development
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    container_name: taskmanagement-backend-dev
    restart: unless-stopped
    command: npm run dev
    environment:
      DATABASE_URL: postgresql://taskuser:taskpassword@postgres:5432/taskmanagement?schema=public
      PORT: 4000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
      WS_PORT: 4001
    ports:
      - "4000:4000"
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - taskmanagement-network

  # Frontend Development
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: taskmanagement-frontend-dev
    restart: unless-stopped
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4001
    ports:
      - "3000:3000"
    depends_on:
      - backend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - taskmanagement-network

volumes:
  postgres_data_dev:
    driver: local

networks:
  taskmanagement-network:
    driver: bridge
